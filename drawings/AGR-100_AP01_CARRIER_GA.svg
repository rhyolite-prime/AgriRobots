<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
  <title>AP-01 MODULAR CARRIER — GENERAL ARRANGEMENT</title>
  <desc>AgriRobots AGR-100 engineering concept drawing. All dimensions millimetres unless noted.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto-start-reverse"><path d="M 0,0 L 9,4.5 L 0,9 z" class="dimfill"/></marker>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M 25 0 L 0 0 0 25" fill="none" stroke="#e7ebef" stroke-width="0.7"/></pattern>
    <style>
      .border { fill:none; stroke:#18232e; stroke-width:2; }
      .obj { fill:#edf3f5; stroke:#18232e; stroke-width:2.3; }
      .dark { fill:#cbd9de; stroke:#18232e; stroke-width:2.3; }
      .detail { fill:none; stroke:#415661; stroke-width:1.6; }
      .hidden { fill:none; stroke:#71838d; stroke-width:1.3; stroke-dasharray:7 5; }
      .center { fill:none; stroke:#3a94a8; stroke-width:1.1; stroke-dasharray:15 5 3 5; }
      .dim { fill:none; stroke:#256f9b; stroke-width:1.25; marker-start:url(#arrow); marker-end:url(#arrow); }
      .ext { fill:none; stroke:#256f9b; stroke-width:1; }
      .dimfill { fill:#256f9b; }
      .datum { fill:#e8f4ed; stroke:#137a4a; stroke-width:1.5; }
      .safe { fill:#fdf3df; stroke:#ac6d12; stroke-width:1.8; stroke-dasharray:7 4; }
      .label { font: 16px Arial, sans-serif; fill:#18232e; }
      .small { font: 13px Arial, sans-serif; fill:#263842; }
      .tiny { font: 11px Arial, sans-serif; fill:#263842; }
      .note { font: 13px Arial, sans-serif; fill:#263842; }
      .dimtxt { font: 15px Arial, sans-serif; font-weight:bold; fill:#256f9b; }
      .view { font: bold 17px Arial, sans-serif; fill:#18232e; }
      .title { font: bold 26px Arial, sans-serif; fill:#18232e; }
      .tb { font: 12px Arial, sans-serif; fill:#18232e; }
      .tbhead { font: bold 12px Arial, sans-serif; fill:#18232e; }
    </style>
  </defs>
  <rect width="1600" height="1050" fill="#ffffff"/>
  <rect x="30" y="30" width="1540" height="990" class="border"/>
  <rect x="45" y="45" width="1510" height="810" fill="url(#grid)"/>
  <text x="60" y="78" class="title">AP-01 MODULAR CARRIER — GENERAL ARRANGEMENT</text>
  <text x="60" y="101" class="small">CONCEPT — NOT FOR FABRICATION · ALL DIMENSIONS IN mm · SCALE: diagrammatic, verify with released CAD</text>

<!-- TOP VIEW -->
<text x="65" y="140" class="view">TOP VIEW — transport configuration</text>
<rect x="150" y="185" width="725" height="390" rx="25" class="obj"/>
<rect x="195" y="235" width="635" height="290" rx="8" class="dark"/>
<!-- cassette bay -->
<rect x="290" y="255" width="450" height="290" rx="4" fill="#ffffff" stroke="#18232e" stroke-width="2"/>
<text x="515" y="405" text-anchor="middle" class="label">UCI-01 cassette bay</text><text x="515" y="425" text-anchor="middle" class="small">900 × 580 usable envelope</text>
<!-- wheels -->
<rect x="263" y="165" width="70" height="80" rx="8" class="dark"/><rect x="697" y="165" width="70" height="80" rx="8" class="dark"/>
<rect x="263" y="515" width="70" height="80" rx="8" class="dark"/><rect x="697" y="515" width="70" height="80" rx="8" class="dark"/>
<path d="M515 150 V610 M125 380 H900" class="center"/>
<text x="865" y="365" class="small">X + forward</text><text x="530" y="625" class="small">Y + left</text>
<!-- sensors and bumper -->
<path d="M150 260 Q100 315 150 370" class="safe"/><text x="75" y="245" class="tiny">front safety field</text>
<circle cx="175" cy="325" r="15" fill="#3a94a8" stroke="#18232e" stroke-width="2"/><text x="201" y="330" class="tiny">safety lidar / mast projection</text>
<path d="M150 185 H875 M150 575 H875" class="detail"/>
<path d="M 150 185 V 155 M 875 185 V 155" class="ext"/><path d="M 150 155 H 875" class="dim"/><text x="512.5" y="148" class="dimtxt" text-anchor="middle">1450 OVERALL</text><path d="M 150 185 H 115 M 150 575 H 115" class="ext"/><path d="M 115 185 V 575" class="dim"/><text x="107" y="380.0" class="dimtxt" text-anchor="middle" transform="rotate(-90 107 380.0)">780 OVERALL</text><path d="M 298 550 V 630 M 732 550 V 630" class="ext"/><path d="M 298 630 H 732" class="dim"/><text x="515.0" y="623" class="dimtxt" text-anchor="middle">1100 WHEELBASE</text><path d="M 875 205 H 945 M 875 535 H 945" class="ext"/><path d="M 945 205 V 535" class="dim"/><text x="937" y="370.0" class="dimtxt" text-anchor="middle" transform="rotate(-90 937 370.0)">660 TYRE CENTRE TRACK</text><text x="250" y="670" class="small">Wheel centres: X = ±550, Y = ±330 from carrier origin</text>
<!-- SIDE VIEW -->
<text x="1010" y="140" class="view">SIDE VIEW — nominal loaded geometry</text>
<path d="M1010 650 H1515" class="detail"/>
<circle cx="1095" cy="545" r="105" class="obj"/><circle cx="1450" cy="545" r="105" class="obj"/>
<rect x="1040" y="385" width="465" height="110" rx="8" class="dark"/>
<rect x="1110" y="275" width="315" height="110" rx="5" class="obj"/>
<rect x="1260" y="155" width="42" height="230" class="dark"/><circle cx="1281" cy="140" r="25" class="dark"/>
<path d="M1028 495 H1517" class="hidden"/><text x="1310" y="260" class="small">sensor mast, transport H</text>
<path d="M 1025 650 V 720 M 1500 650 V 720" class="ext"/><path d="M 1025 720 H 1500" class="dim"/><text x="1262.5" y="713" class="dimtxt" text-anchor="middle">1450 OVERALL</text><path d="M 1095 650 V 690 M 1450 650 V 690" class="ext"/><path d="M 1095 690 H 1450" class="dim"/><text x="1272.5" y="683" class="dimtxt" text-anchor="middle">1100 WHEELBASE</text><path d="M 1500 140 H 1535 M 1500 650 H 1535" class="ext"/><path d="M 1535 140 V 650" class="dim"/><text x="1527" y="395.0" class="dimtxt" text-anchor="middle" transform="rotate(-90 1527 395.0)">1050 MAX H</text><path d="M 1040 495 H 990 M 1040 650 H 990" class="ext"/><path d="M 990 495 V 650" class="dim"/><text x="982" y="572.5" class="dimtxt" text-anchor="middle" transform="rotate(-90 982 572.5)">160 GROUND CLEARANCE</text><path d="M 1095 440 H 965 M 1095 650 H 965" class="ext"/><path d="M 965 440 V 650" class="dim"/><text x="957" y="545.0" class="dimtxt" text-anchor="middle" transform="rotate(-90 957 545.0)">Ø420 WHEEL</text><text x="1025" y="750" class="small">Nominal rating: 125 kg cassette payload; final mass/CG and stability rating require test.</text>
<text x="60" y="885" class="note">Views show nominal envelopes only. No tolerance, weld, material, brake, or structural release is provided on this sheet.</text><text x="60" y="905" class="note">Wheel/steering, stop distance, sensor coverage and cassette CG must be validated for the actual operating design domain.</text><text x="60" y="925" class="note">Datums: carrier origin = ground projection of cassette-bay geometric centre; X forward, Y left, Z up.</text>
  <g transform="translate(1010,870)">
    <rect x="0" y="0" width="545" height="135" class="border" fill="#f8fafb"/>
    <path d="M 0 30 H 545 M 0 75 H 545 M 170 0 V 135 M 365 0 V 135" class="detail"/>
    <text x="10" y="20" class="tbhead">PROJECT / DRAWING</text><text x="180" y="20" class="tbhead">REV</text><text x="375" y="20" class="tbhead">STATUS</text>
    <text x="10" y="52" class="tb">AgriRobots / AGR-100</text><text x="180" y="52" class="tb">A · 05 OCT 2026</text><text x="375" y="52" class="tb">CONCEPT</text>
    <text x="10" y="96" class="tbhead">TITLE</text><text x="10" y="115" class="tb">AP-01 MODULAR CARRIER — GENERAL ARRANGEMENT</text>
    <text x="180" y="96" class="tbhead">UNITS</text><text x="180" y="115" class="tb">mm / kg / V as marked</text>
    <text x="375" y="96" class="tbhead">RELEASE</text><text x="375" y="115" class="tb">NOT FOR FABRICATION</text>
  </g>
</svg>
