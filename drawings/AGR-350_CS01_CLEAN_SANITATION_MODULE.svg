      .dark { fill:#cbd9de; stroke:#18232e; stroke-width:2.3; }
      .detail { fill:none; stroke:#415661; stroke-width:1.6; }
      .hidden { fill:none; stroke:#71838d; stroke-width:1.3; stroke-dasharray:7 5; }
      .center { fill:none; stroke:#3a94a8; stroke-width:1.1; stroke-dasharray:15 5 3 5; }
      .dim { fill:none; stroke:#256f9b; stroke-width:1.25; marker-start:url(#arrow); marker-end:url(#arrow); }
      .ext { fill:none; stroke:#256f9b; stroke-width:1; }
      .dimfill { fill:#256f9b; }
      .datum { fill:#e8f4ed; stroke:#137a4a; stroke-width:1.5; }
      .safe { fill:#fdf3df; stroke:#ac6d12; stroke-width:1.8; stroke-dasharray:7 4; }
      .label { font: 16px Arial, sans-serif; fill:#18232e; }
      .small { font: 13px Arial, sans-serif; fill:#263842; }
      .tiny { font: 11px Arial, sans-serif; fill:#263842; }
      .note { font: 13px Arial, sans-serif; fill:#263842; }
      .dimtxt { font: 15px Arial, sans-serif; font-weight:bold; fill:#256f9b; }
      .view { font: bold 17px Arial, sans-serif; fill:#18232e; }
      .title { font: bold 26px Arial, sans-serif; fill:#18232e; }
      .tb { font: 12px Arial, sans-serif; fill:#18232e; }
      .tbhead { font: bold 12px Arial, sans-serif; fill:#18232e; }
    </style>
  </defs>
  <rect width="1600" height="1050" fill="#ffffff"/>
  <rect x="30" y="30" width="1540" height="990" class="border"/>
  <rect x="45" y="45" width="1510" height="810" fill="url(#grid)"/>
  <text x="60" y="78" class="title">CS-01 CLEANING / SANITATION CASSETTE — FLUID AND TOOL CONCEPT</text>
  <text x="60" y="101" class="small">CONCEPT — NOT FOR FABRICATION · ALL DIMENSIONS IN mm · SCALE: diagrammatic, verify with released CAD</text>

<text x="65" y="140" class="view">SIDE VIEW — baffled tank, secondary containment and low-pressure application</text>
<path d="M70 690 H930" class="detail"/>
<rect x="150" y="625" width="540" height="30" class="dark"/><rect x="190" y="350" width="330" height="250" rx="18" class="obj"/>
<path d="M270 355 V595 M350 355 V595 M430 355 V595" class="detail"/><path d="M210 385 H500" class="hidden"/><text x="355" y="475" text-anchor="middle" class="label">60 L working solution</text><text x="355" y="495" text-anchor="middle" class="small">baffled tank + level sensing</text>
<rect x="545" y="440" width="100" height="115" class="dark"/><text x="595" y="485" text-anchor="middle" class="tiny">pump</text><text x="595" y="500" text-anchor="middle" class="tiny">flow/pressure</text>
<path d="M520 510 H545 M645 510 H760 V575 H825" class="detail"/><path d="M760 575 V630" class="detail"/><path d="M785 630 l20 30 M815 630 l-5 35" class="detail"/>
<rect x="200" y="600" width="480" height="20" class="safe"/><text x="225" y="618" class="tiny">secondary containment / drip tray zone</text><text x="760" y="550" class="tiny">guarded low-pressure manifold</text>
<path d="M 150 655 V 720 M 690 655 V 720" class="ext"/><path d="M 150 720 H 690" class="dim"/><text x="420.0" y="713" class="dimtxt" text-anchor="middle">900 CASSETTE L</text><path d="M 150 350 H 110 M 150 625 H 110" class="ext"/><path d="M 110 350 V 625" class="dim"/><text x="102" y="487.5" class="dimtxt" text-anchor="middle" transform="rotate(-90 102 487.5)">600 MAX H ABOVE DATUM A</text><path d="M 760 630 H 870 M 760 690 H 870" class="ext"/><path d="M 870 630 V 690" class="dim"/><text x="862" y="660.0" class="dimtxt" text-anchor="middle" transform="rotate(-90 862 660.0)">60 TOOL PROJECTION SHOWN</text><text x="160" y="750" class="small">Provisional: 3–8 bar and 2–10 L/min. These are design inputs, not a chemical-process authorization.</text>
<!-- plan and pathway -->
<text x="1010" y="140" class="view">TOP VIEW — segregated fill / chemistry path</text><rect x="1010" y="190" width="450" height="290" class="obj"/><rect x="1040" y="220" width="250" height="225" rx="15" class="detail"/><rect x="1320" y="245" width="100" height="85" class="dark"/><circle cx="1370" cy="395" r="28" class="safe"/>
<text x="1165" y="330" text-anchor="middle" class="small">baffled tank</text><text x="1370" y="290" text-anchor="middle" class="tiny">pump bay</text><text x="1370" y="400" text-anchor="middle" class="tiny">keyed fill</text>
<path d="M 1010 480 V 530 M 1460 480 V 530" class="ext"/><path d="M 1010 530 H 1460" class="dim"/><text x="1235.0" y="523" class="dimtxt" text-anchor="middle">900</text><path d="M 1010 190 H 975 M 1010 480 H 975" class="ext"/><path d="M 975 190 V 480" class="dim"/><text x="967" y="335.0" class="dimtxt" text-anchor="middle" transform="rotate(-90 967 335.0)">580</text><rect x="1000" y="590" width="480" height="165" class="safe"/><text x="1020" y="618" class="small">PROCESS LIMITS</text><text x="1020" y="645" class="tiny">• chemistry/SDS, seal compatibility and waste route must be approved</text><text x="1020" y="668" class="tiny">• default operation: low-pressure, low-drift, defined empty/controlled zone</text><text x="1020" y="691" class="tiny">• log lot, dilution, flow, pressure, zone and dwell window</text><text x="1020" y="714" class="tiny">• dry tools/fluid subassemblies are removable and labelled</text>
<text x="60" y="885" class="note">Chemical selection, tank material, seals, PPE, ventilation, discharge/recovery and worker exclusion are unresolved process inputs.</text><text x="60" y="905" class="note">The tank must be baffled and tested in worst-case fill/CG/slosh braking and turn conditions.</text><text x="60" y="925" class="note">High-pressure washing, generic disinfection, and operating around unprotected animals/people are outside this sheet.</text>
