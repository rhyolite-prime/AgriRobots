<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
  <title>CS-01 CLEANING / SANITATION CASSETTE — FLUID AND TOOL CONCEPT</title>
  <desc>AgriRobots AGR-350 engineering concept drawing. All dimensions millimetres unless noted.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto-start-reverse"><path d="M 0,0 L 9,4.5 L 0,9 z" class="dimfill"/></marker>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M 25 0 L 0 0 0 25" fill="none" stroke="#e7ebef" stroke-width="0.7"/></pattern>
    <style>
      .border { fill:none; stroke:#18232e; stroke-width:2; }
