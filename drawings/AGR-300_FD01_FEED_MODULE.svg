<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
  <title>FD-01 DRY FEED CASSETTE — HOPPER AND DISPENSE CONCEPT</title>
  <desc>AgriRobots AGR-300 engineering concept drawing. All dimensions millimetres unless noted.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto-start-reverse"><path d="M 0,0 L 9,4.5 L 0,9 z" class="dimfill"/></marker>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M 25 0 L 0 0 0 25" fill="none" stroke="#e7ebef" stroke-width="0.7"/></pattern>
    <style>
      .border { fill:none; stroke:#18232e; stroke-width:2; }
      .obj { fill:#edf3f5; stroke:#18232e; stroke-width:2.3; }
      .dark { fill:#cbd9de; stroke:#18232e; stroke-width:2.3; }
      .detail { fill:none; stroke:#415661; stroke-width:1.6; }
      .hidden { fill:none; stroke:#71838d; stroke-width:1.3; stroke-dasharray:7 5; }
      .center { fill:none; stroke:#3a94a8; stroke-width:1.1; stroke-dasharray:15 5 3 5; }
      .dim { fill:none; stroke:#256f9b; stroke-width:1.25; marker-start:url(#arrow); marker-end:url(#arrow); }
      .ext { fill:none; stroke:#256f9b; stroke-width:1; }
      .dimfill { fill:#256f9b; }
      .datum { fill:#e8f4ed; stroke:#137a4a; stroke-width:1.5; }
      .safe { fill:#fdf3df; stroke:#ac6d12; stroke-width:1.8; stroke-dasharray:7 4; }
      .label { font: 16px Arial, sans-serif; fill:#18232e; }
      .small { font: 13px Arial, sans-serif; fill:#263842; }
      .tiny { font: 11px Arial, sans-serif; fill:#263842; }
      .note { font: 13px Arial, sans-serif; fill:#263842; }
      .dimtxt { font: 15px Arial, sans-serif; font-weight:bold; fill:#256f9b; }
      .view { font: bold 17px Arial, sans-serif; fill:#18232e; }
      .title { font: bold 26px Arial, sans-serif; fill:#18232e; }
      .tb { font: 12px Arial, sans-serif; fill:#18232e; }
      .tbhead { font: bold 12px Arial, sans-serif; fill:#18232e; }
    </style>
  </defs>
  <rect width="1600" height="1050" fill="#ffffff"/>
  <rect x="30" y="30" width="1540" height="990" class="border"/>
  <rect x="45" y="45" width="1510" height="810" fill="url(#grid)"/>
  <text x="60" y="78" class="title">FD-01 DRY FEED CASSETTE — HOPPER AND DISPENSE CONCEPT</text>
  <text x="60" y="101" class="small">CONCEPT — NOT FOR FABRICATION · ALL DIMENSIONS IN mm · SCALE: diagrammatic, verify with released CAD</text>

<text x="65" y="140" class="view">SIDE VIEW — dry feed hopper, metering, adjustable chute</text>
<path d="M75 690 H950" class="detail"/>
<rect x="160" y="625" width="540" height="30" class="dark"/>
<path d="M220 250 H600 L655 570 H175 Z" class="obj"/><path d="M230 270 H590" class="detail"/><path d="M220 250 L175 570 H655 L600 250" class="detail"/>
<rect x="330" y="570" width="165" height="42" class="dark"/><circle cx="365" cy="591" r="16" class="obj"/><circle cx="455" cy="591" r="16" class="obj"/>
<path d="M495 590 H745 V635 H805" class="dark"/><path d="M745 590 V535 H815" class="detail"/><path d="M745 635 V690" class="hidden"/>
<text x="405" y="400" text-anchor="middle" class="label">85 L nominal</text><text x="405" y="421" text-anchor="middle" class="small">dry feed hopper</text>
<text x="413" y="607" text-anchor="middle" class="tiny">removable auger / rotary valve</text><text x="785" y="525" class="tiny">adjustable guarded chute</text>
<path d="M 160 655 V 720 M 700 655 V 720" class="ext"/><path d="M 160 720 H 700" class="dim"/><text x="430.0" y="713" class="dimtxt" text-anchor="middle">900 CASSETTE L</text><path d="M 160 250 H 120 M 160 625 H 120" class="ext"/><path d="M 120 250 V 625" class="dim"/><text x="112" y="437.5" class="dimtxt" text-anchor="middle" transform="rotate(-90 112 437.5)">600 MAX H ABOVE DATUM A</text><path d="M 745 535 H 870 M 745 690 H 870" class="ext"/><path d="M 870 535 V 690" class="dim"/><text x="862" y="612.5" class="dimtxt" text-anchor="middle" transform="rotate(-90 862 612.5)">155 CHUTE ADJUST RANGE</text><path d="M220 250 H600" class="dim"/><text x="410" y="240" text-anchor="middle" class="dimtxt">nominal 85 L usable volume</text>
<text x="160" y="750" class="small">Maximum filled feed mass: 55 kg target, subject to bulk density, CG, stability and load-path verification.</text>
<!-- plan -->
<text x="1040" y="140" class="view">TOP VIEW — UCI footprint</text><rect x="1040" y="190" width="450" height="290" class="obj"/><path d="M1080 230 H1400 V430 H1080 Z" class="detail"/><circle cx="1450" cy="335" r="25" class="dark"/>
<text x="1240" y="320" text-anchor="middle" class="small">hopper plan / cleanout access</text><text x="1450" y="375" text-anchor="middle" class="tiny">chute</text>
<path d="M 1040 480 V 530 M 1490 480 V 530" class="ext"/><path d="M 1040 530 H 1490" class="dim"/><text x="1265.0" y="523" class="dimtxt" text-anchor="middle">900</text><path d="M 1040 190 H 1005 M 1040 480 H 1005" class="ext"/><path d="M 1005 190 V 480" class="dim"/><text x="997" y="335.0" class="dimtxt" text-anchor="middle" transform="rotate(-90 997 335.0)">580</text><rect x="1025" y="590" width="480" height="165" class="safe"/><text x="1045" y="618" class="small">FUNCTIONAL INTERLOCKS</text><text x="1045" y="645" class="tiny">• dispense only when dock/zone and chute state are valid</text><text x="1045" y="668" class="tiny">• load-cell / meter verification; no blind automatic double dose</text><text x="1045" y="691" class="tiny">• guard auger; jam clearing is LOTO/service procedure</text><text x="1045" y="714" class="tiny">• calibration is tied to feed lot and configuration</text>
<text x="60" y="885" class="note">Feed geometry, bulk density, bridging, clean-out and trough height must be measured at the pilot farm.</text><text x="60" y="905" class="note">All feed-contact materials and cleaning process require process-owner review. Metering performance must be bench-calibrated.</text><text x="60" y="925" class="note">No dimensions on this concept sheet supersede final motor torque, guard, mass/CG or stability calculations.</text>
  <g transform="translate(1010,870)">
    <rect x="0" y="0" width="545" height="135" class="border" fill="#f8fafb"/>
    <path d="M 0 30 H 545 M 0 75 H 545 M 170 0 V 135 M 365 0 V 135" class="detail"/>
    <text x="10" y="20" class="tbhead">PROJECT / DRAWING</text><text x="180" y="20" class="tbhead">REV</text><text x="375" y="20" class="tbhead">STATUS</text>
    <text x="10" y="52" class="tb">AgriRobots / AGR-300</text><text x="180" y="52" class="tb">A · 05 OCT 2026</text><text x="375" y="52" class="tb">CONCEPT</text>
    <text x="10" y="96" class="tbhead">TITLE</text><text x="10" y="115" class="tb">FD-01 DRY FEED CASSETTE</text>
    <text x="180" y="96" class="tbhead">UNITS</text><text x="180" y="115" class="tb">mm / kg / V as marked</text>
    <text x="375" y="96" class="tbhead">RELEASE</text><text x="375" y="115" class="tb">NOT FOR FABRICATION</text>
  </g>
</svg>
