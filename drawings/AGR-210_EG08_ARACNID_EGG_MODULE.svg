<text x="1117" y="573.5" class="tc">conditional</text>
<text x="1227" y="573.5" class="tc">G6 + approval</text>
<path d="M 1110 500 V 579" class="detail" stroke-width="0.7"/>
<path d="M 1220 500 V 579" class="detail" stroke-width="0.7"/>
<text x="980" y="620" class="note">1. Collection and traceability only. Shell treatment is a separate</text>
<text x="980" y="636" class="note">   validated process with its own owner and gate; it is absent from the</text>
<text x="980" y="652" class="note">   grammar, the allow-list and the manifest.</text>
<text x="980" y="668" class="note">2. Magazine may not index while any hand is inside the bay (SF-AR-10,</text>
<text x="980" y="684" class="note">   compile-time and gate-time).</text>
<text x="980" y="700" class="note">3. Trays, arm contact surfaces and the bay are wash-down to a contained</text>
<text x="980" y="716" class="note">   path; food-contact materials require approved migration review</text>
<text x="980" y="732" class="note">   before use with eggs.</text>
<text x="980" y="748" class="note">4. Throughput is the measured number from G-B1 and the pilot, including</text>
<text x="980" y="764" class="note">   abstentions and tray indexing — not the theoretical eight-hand rate.</text>
