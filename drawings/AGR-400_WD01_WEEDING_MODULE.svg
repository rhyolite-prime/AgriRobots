<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
  <title>WD-01 VISION-GUIDED EARLY WEEDING CASSETTE — TOOL ENVELOPE</title>
  <desc>AgriRobots AGR-400 engineering concept drawing. All dimensions millimetres unless noted.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto-start-reverse"><path d="M 0,0 L 9,4.5 L 0,9 z" class="dimfill"/></marker>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M 25 0 L 0 0 0 25" fill="none" stroke="#e7ebef" stroke-width="0.7"/></pattern>
    <style>
      .border { fill:none; stroke:#18232e; stroke-width:2; }
      .obj { fill:#edf3f5; stroke:#18232e; stroke-width:2.3; }
      .dark { fill:#cbd9de; stroke:#18232e; stroke-width:2.3; }
      .detail { fill:none; stroke:#415661; stroke-width:1.6; }
      .hidden { fill:none; stroke:#71838d; stroke-width:1.3; stroke-dasharray:7 5; }
      .center { fill:none; stroke:#3a94a8; stroke-width:1.1; stroke-dasharray:15 5 3 5; }
      .dim { fill:none; stroke:#256f9b; stroke-width:1.25; marker-start:url(#arrow); marker-end:url(#arrow); }
      .ext { fill:none; stroke:#256f9b; stroke-width:1; }
      .dimfill { fill:#256f9b; }
      .datum { fill:#e8f4ed; stroke:#137a4a; stroke-width:1.5; }
      .safe { fill:#fdf3df; stroke:#ac6d12; stroke-width:1.8; stroke-dasharray:7 4; }
      .label { font: 16px Arial, sans-serif; fill:#18232e; }
      .small { font: 13px Arial, sans-serif; fill:#263842; }
      .tiny { font: 11px Arial, sans-serif; fill:#263842; }
      .note { font: 13px Arial, sans-serif; fill:#263842; }
      .dimtxt { font: 15px Arial, sans-serif; font-weight:bold; fill:#256f9b; }
      .view { font: bold 17px Arial, sans-serif; fill:#18232e; }
      .title { font: bold 26px Arial, sans-serif; fill:#18232e; }
      .tb { font: 12px Arial, sans-serif; fill:#18232e; }
      .tbhead { font: bold 12px Arial, sans-serif; fill:#18232e; }
    </style>
  </defs>
  <rect width="1600" height="1050" fill="#ffffff"/>
  <rect x="30" y="30" width="1540" height="990" class="border"/>
  <rect x="45" y="45" width="1510" height="810" fill="url(#grid)"/>
  <text x="60" y="78" class="title">WD-01 VISION-GUIDED EARLY WEEDING CASSETTE — TOOL ENVELOPE</text>
  <text x="60" y="101" class="small">CONCEPT — NOT FOR FABRICATION · ALL DIMENSIONS IN mm · SCALE: diagrammatic, verify with released CAD</text>

<text x="65" y="140" class="view">SIDE VIEW — camera working distance and guarded Z tool stroke</text>
<path d="M70 690 H950" class="detail"/><path d="M100 685 q35 -30 70 0 q35 -30 70 0 q35 -30 70 0 q35 -30 70 0 q35 -30 70 0 q35 -30 70 0 q35 -30 70 0 q35 -30 70 0" class="detail"/>
<rect x="150" y="605" width="540" height="30" class="dark"/><rect x="180" y="335" width="465" height="235" rx="6" class="obj"/>
<rect x="240" y="375" width="345" height="50" class="dark"/><rect x="390" y="425" width="55" height="115" class="dark"/><circle cx="417" cy="555" r="28" class="obj"/><path d="M417 582 V670" class="detail"/><path d="M390 665 H444" class="detail"/>
<path d="M417 583 V670" class="safe"/><path d="M355 540 L260 660 M480 540 L575 660" class="detail"/><text x="417" y="320" text-anchor="middle" class="small">camera + diffuse strobed light</text><text x="472" y="503" class="tiny">Z stage / guarded tool</text>
<path d="M 150 635 V 720 M 690 635 V 720" class="ext"/><path d="M 150 720 H 690" class="dim"/><text x="420.0" y="713" class="dimtxt" text-anchor="middle">900 CASSETTE L</text><path d="M 150 335 H 110 M 150 605 H 110" class="ext"/><path d="M 110 335 V 605" class="dim"/><text x="102" y="470.0" class="dimtxt" text-anchor="middle" transform="rotate(-90 102 470.0)">520 MAX H ABOVE DATUM A</text><path d="M 417 425 H 770 M 417 670 H 770" class="ext"/><path d="M 770 425 V 670" class="dim"/><text x="762" y="547.5" class="dimtxt" text-anchor="middle" transform="rotate(-90 762 547.5)">450–650 CAMERA WORKING DISTANCE</text><path d="M 417 540 H 840 M 417 670 H 840" class="ext"/><path d="M 840 540 V 670" class="dim"/><text x="832" y="605.0" class="dimtxt" text-anchor="middle" transform="rotate(-90 832 605.0)">180 MAX Z STROKE</text><text x="160" y="750" class="small">Tool operates only in a restricted approved plot; all uncertain detections are recorded and skipped.</text>
<!-- top view -->
<text x="1010" y="140" class="view">TOP VIEW — X-Y tool travel (not crop coverage claim)</text><rect x="1010" y="190" width="450" height="290" class="obj"/><rect x="1070" y="235" width="310" height="190" class="safe"/><rect x="1120" y="270" width="210" height="120" class="dark"/><circle cx="1225" cy="330" r="18" class="obj"/>
<path d="M1095 440 H1355" class="dim"/><text x="1225" y="465" text-anchor="middle" class="dimtxt">500 X TRAVEL</text><path d="M1400 255 V405" class="dim"/><text x="1420" y="330" class="dimtxt" transform="rotate(-90 1420 330)" text-anchor="middle">460 Y TRAVEL</text>
<text x="1225" y="338" text-anchor="middle" class="tiny">tool</text>
<path d="M 1010 480 V 530 M 1460 480 V 530" class="ext"/><path d="M 1010 530 H 1460" class="dim"/><text x="1235.0" y="523" class="dimtxt" text-anchor="middle">900</text><path d="M 1010 190 H 975 M 1010 480 H 975" class="ext"/><path d="M 975 190 V 480" class="dim"/><text x="967" y="335.0" class="dimtxt" text-anchor="middle" transform="rotate(-90 967 335.0)">580</text><rect x="1000" y="590" width="480" height="165" class="safe"/><text x="1020" y="618" class="small">ACTUATION GATES — ALL REQUIRED</text><text x="1020" y="645" class="tiny">• approved zone + operator policy + parked-to-armed sequence</text><text x="1020" y="668" class="tiny">• calibrated camera/tool transform and valid timestamp/pose</text><text x="1020" y="691" class="tiny">• weed confidence ≥ configured threshold; crop clearance ≥ 20 mm</text><text x="1020" y="714" class="tiny">• pose σ ≤ 3 mm and latency ≤ 100 ms (initial policy targets)</text>
<text x="60" y="885" class="note">X/Y/Z travels are mechanical concepts. Actual crop geometry, actuation type and clearance are crop/site-specific and must be validated.</text><text x="60" y="905" class="note">Camera detection is not a personnel/animal safety sensor. Guards and independent tool energy enable are required.</text><text x="60" y="925" class="note">Initial tool target is ≤±5 mm in a guarded test lane at ≤0.30 m/s; this is not field-proven performance.</text>
  <g transform="translate(1010,870)">
    <rect x="0" y="0" width="545" height="135" class="border" fill="#f8fafb"/>
    <path d="M 0 30 H 545 M 0 75 H 545 M 170 0 V 135 M 365 0 V 135" class="detail"/>
