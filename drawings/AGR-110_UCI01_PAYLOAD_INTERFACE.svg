<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
  <title>UCI-01 UNIVERSAL CASSETTE INTERFACE — DATUM AND LOCKING SCHEME</title>
  <desc>AgriRobots AGR-110 engineering concept drawing. All dimensions millimetres unless noted.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto-start-reverse"><path d="M 0,0 L 9,4.5 L 0,9 z" class="dimfill"/></marker>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M 25 0 L 0 0 0 25" fill="none" stroke="#e7ebef" stroke-width="0.7"/></pattern>
    <style>
      .border { fill:none; stroke:#18232e; stroke-width:2; }
      .obj { fill:#edf3f5; stroke:#18232e; stroke-width:2.3; }
      .dark { fill:#cbd9de; stroke:#18232e; stroke-width:2.3; }
      .detail { fill:none; stroke:#415661; stroke-width:1.6; }
      .hidden { fill:none; stroke:#71838d; stroke-width:1.3; stroke-dasharray:7 5; }
      .center { fill:none; stroke:#3a94a8; stroke-width:1.1; stroke-dasharray:15 5 3 5; }
      .dim { fill:none; stroke:#256f9b; stroke-width:1.25; marker-start:url(#arrow); marker-end:url(#arrow); }
      .ext { fill:none; stroke:#256f9b; stroke-width:1; }
      .dimfill { fill:#256f9b; }
      .datum { fill:#e8f4ed; stroke:#137a4a; stroke-width:1.5; }
      .safe { fill:#fdf3df; stroke:#ac6d12; stroke-width:1.8; stroke-dasharray:7 4; }
      .label { font: 16px Arial, sans-serif; fill:#18232e; }
      .small { font: 13px Arial, sans-serif; fill:#263842; }
      .tiny { font: 11px Arial, sans-serif; fill:#263842; }
      .note { font: 13px Arial, sans-serif; fill:#263842; }
      .dimtxt { font: 15px Arial, sans-serif; font-weight:bold; fill:#256f9b; }
      .view { font: bold 17px Arial, sans-serif; fill:#18232e; }
      .title { font: bold 26px Arial, sans-serif; fill:#18232e; }
      .tb { font: 12px Arial, sans-serif; fill:#18232e; }
      .tbhead { font: bold 12px Arial, sans-serif; fill:#18232e; }
    </style>
  </defs>
  <rect width="1600" height="1050" fill="#ffffff"/>
  <rect x="30" y="30" width="1540" height="990" class="border"/>
  <rect x="45" y="45" width="1510" height="810" fill="url(#grid)"/>
  <text x="60" y="78" class="title">UCI-01 UNIVERSAL CASSETTE INTERFACE — DATUM AND LOCKING SCHEME</text>
  <text x="60" y="101" class="small">CONCEPT — NOT FOR FABRICATION · ALL DIMENSIONS IN mm · SCALE: diagrammatic, verify with released CAD</text>

<text x="65" y="140" class="view">PLAN VIEW — carrier support rails and cassette mating plane</text>
<rect x="230" y="180" width="900" height="580" class="obj"/>
<rect x="250" y="205" width="860" height="530" rx="4" fill="#ffffff" stroke="#415661" stroke-width="1.5"/>
<!-- rails -->
<rect x="275" y="240" width="810" height="45" class="dark"/><rect x="275" y="655" width="810" height="45" class="dark"/>
<text x="680" y="268" text-anchor="middle" class="small">replaceable support rail / datum A plane</text>
<path d="M680 160 V780 M200 470 H1160" class="center"/>
<!-- four locks -->
<g fill="#fdf3df" stroke="#ac6d12" stroke-width="2"><circle cx="330" cy="250" r="18"/><circle cx="1030" cy="250" r="18"/><circle cx="330" cy="690" r="18"/><circle cx="1030" cy="690" r="18"/></g>
<text x="330" y="255" text-anchor="middle" class="tiny">M12</text><text x="1030" y="255" text-anchor="middle" class="tiny">M12</text><text x="330" y="695" text-anchor="middle" class="tiny">M12</text><text x="1030" y="695" text-anchor="middle" class="tiny">M12</text>
<!-- location cones -->
<g class="datum"><circle cx="360" cy="335" r="15"/><circle cx="1000" cy="335" r="15"/><rect x="345" y="585" width="30" height="18"/><rect x="985" y="585" width="30" height="18"/></g>
<text x="360" y="320" text-anchor="middle" class="tiny">P1</text><text x="1000" y="320" text-anchor="middle" class="tiny">P2</text><text x="360" y="625" text-anchor="middle" class="tiny">P3</text><text x="1000" y="625" text-anchor="middle" class="tiny">P4</text>
<rect x="630" y="705" width="100" height="32" class="dark"/><text x="680" y="727" text-anchor="middle" class="tiny">keyed I/O</text>
<path d="M 230 760 V 810 M 1130 760 V 810" class="ext"/><path d="M 230 810 H 1130" class="dim"/><text x="680.0" y="803" class="dimtxt" text-anchor="middle">900 USABLE X</text><path d="M 230 180 H 120 M 230 760 H 120" class="ext"/><path d="M 120 180 V 760" class="dim"/><text x="112" y="470.0" class="dimtxt" text-anchor="middle" transform="rotate(-90 112 470.0)">580 USABLE Y</text><path d="M 330 180 V 130 M 1030 180 V 130" class="ext"/><path d="M 330 130 H 1030" class="dim"/><text x="680.0" y="123" class="dimtxt" text-anchor="middle">700 LOCK PITCH X</text><path d="M 1130 250 H 1180 M 1130 690 H 1180" class="ext"/><path d="M 1180 250 V 690" class="dim"/><text x="1172" y="470.0" class="dimtxt" text-anchor="middle" transform="rotate(-90 1172 470.0)">440 LOCK PITCH Y</text><path d="M360 335 H1000" class="dim"/><text x="680" y="327" text-anchor="middle" class="dimtxt">640 LOCATOR PITCH</text>
<text x="245" y="840" class="small">Lock centres: X = ±350, Y = ±220. Locators shown conceptually; final tapered-pin/bushing geometry requires tolerance stack.</text>
<!-- side schematic -->
<text x="65" y="890" class="view">SECTION A-A — support and interlock principle</text>
<path d="M120 965 H880" class="detail"/><rect x="250" y="915" width="480" height="50" class="dark"/><rect x="310" y="855" width="360" height="60" class="obj"/>
<path d="M350 915 v35 h-30 v35 h90 v-35 h-30 v-35" class="detail"/><path d="M630 915 v35 h-30 v35 h90 v-35 h-30 v-35" class="detail"/>
<text x="490" y="890" text-anchor="middle" class="small">cassette underside / drainable plane</text><text x="490" y="945" text-anchor="middle" class="tiny">carrier support rail / datum A</text>
<text x="150" y="995" class="small">Closed/locked sensors + keyed connector + module identity must agree before 48 V/tool enable.</text>
<text x="60" y="885" class="note">Four captive M12 clamps are a concept retention method; final clamp rating, torque and retention require analysis and vibration testing.</text><text x="60" y="905" class="note">P1/P2/P3/P4 locate a cassette using a 3-2-1 scheme. Mechanical datum strategy must be completed at detailed design review.</text><text x="60" y="925" class="note">Dry-break fluid ports are optional and normally disconnected. No live connector/cassette removal is permitted.</text>
  <g transform="translate(1010,870)">
    <rect x="0" y="0" width="545" height="135" class="border" fill="#f8fafb"/>
    <path d="M 0 30 H 545 M 0 75 H 545 M 170 0 V 135 M 365 0 V 135" class="detail"/>
    <text x="10" y="20" class="tbhead">PROJECT / DRAWING</text><text x="180" y="20" class="tbhead">REV</text><text x="375" y="20" class="tbhead">STATUS</text>
    <text x="10" y="52" class="tb">AgriRobots / AGR-110</text><text x="180" y="52" class="tb">A · 05 OCT 2026</text><text x="375" y="52" class="tb">CONCEPT</text>
    <text x="10" y="96" class="tbhead">TITLE</text><text x="10" y="115" class="tb">UCI-01 UNIVERSAL CASSETTE INTERFACE</text>
    <text x="180" y="96" class="tbhead">UNITS</text><text x="180" y="115" class="tb">mm / kg / V as marked</text>
    <text x="375" y="96" class="tbhead">RELEASE</text><text x="375" y="115" class="tb">NOT FOR FABRICATION</text>
  </g>
</svg>
