<path d="M 1060 341 H 1490" class="detail" stroke-width="0.7"/>
<text x="1067" y="335.5" class="tc">SF-AR-01</text>
<text x="1147" y="335.5" class="tc">e-stop ×4 + HMI: torque off, brake, vent</text>
<path d="M 1060 360 H 1490" class="detail" stroke-width="0.7"/>
<text x="1067" y="354.5" class="tc">SF-AR-02</text>
<text x="1147" y="354.5" class="tc">arm-envelope scanner breach: arms hold</text>
<path d="M 1060 379 H 1490" class="detail" stroke-width="0.7"/>
<text x="1067" y="373.5" class="tc">SF-AR-05</text>
<text x="1147" y="373.5" class="tc">latch/ID mismatch: inhibit tool+travel</text>
<path d="M 1060 398 H 1490" class="detail" stroke-width="0.7"/>
<text x="1067" y="392.5" class="tc">SF-AR-06</text>
<text x="1147" y="392.5" class="tc">deploy interlock: parked + permitted</text>
<path d="M 1060 417 H 1490" class="detail" stroke-width="0.7"/>
<text x="1067" y="411.5" class="tc">SF-AR-08</text>
<text x="1147" y="411.5" class="tc">tilt beyond limit: remove energy</text>
<path d="M 1060 436 H 1490" class="detail" stroke-width="0.7"/>
<text x="1067" y="430.5" class="tc">SF-AR-09</text>
<text x="1147" y="430.5" class="tc">heartbeat loss: controlled stop, vent</text>
<path d="M 1140 300 V 436" class="detail" stroke-width="0.7"/>
<text x="1060" y="470" class="note">1. AR-01 is a new carrier: wider track and a 165 kg payload rating than</text>
<text x="1060" y="487" class="note">   AP-01 because eight deployed arms move the CG outward. UCI-01</text>
<text x="1060" y="504" class="note">   geometry, clamps, connector and latch/ID interlock are unchanged, so</text>
<text x="1060" y="521" class="note">   FD-01 and CS-01 still mount here.</text>
<text x="1060" y="538" class="note">2. No tolerance is implied by any number on this sheet. Release</text>
<text x="1060" y="555" class="note">   requires parametric CAD, FEA, measured mass/CG, tolerance stack-up</text>
<text x="1060" y="572" class="note">   and GD&amp;T.</text>
<text x="1060" y="589" class="note">3. The deployed envelope is an exclusion zone monitored by arm-envelope</text>
<text x="1060" y="606" class="note">   scanners; it is not a travel corridor. Arms deploy only when</text>
<text x="1060" y="623" class="note">   parked/braked and tool_energy is granted.</text>
<text x="1060" y="640" class="note">4. The deployed-arm load case governs stability. Remedies in order:</text>
<text x="1060" y="657" class="note">   interleave banks, ballast/outriggers, reduce reach, widen track. A</text>
<text x="1060" y="674" class="note">   software speed cap is not a stability remedy.</text>
<text x="300" y="900" class="note">Kinematics: AGR-130 · cassette + traceability: AGR-210 · basis: docs/10_ARACNID_AR01_DESIGN_BASIS.md</text>
<text x="430" y="918" class="note">Origin: ground projection of cassette-bay centre. Datum A = cassette support plane.</text>
