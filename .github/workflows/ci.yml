name: CI

on:
  push:
    branches:
      - master
      - dev
      - "arena/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Structure, links, types, lint, format, tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check repository boundaries
        run: npm run check:tree

      - name: Check documentation links
        run: npm run check:links

      - name: Check DSL grammar conformance
        run: npm run check:grammar

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Unit tests
        run: npm run test

  virtual-lab:
    # The app is not covered by `npm run verify`: the root typecheck does not see
    # Vue single-file components, and only a real build proves that Nitro can
    # bundle the workspace packages' TypeScript sources.
    name: Virtual Lab typecheck and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare Nuxt types
        run: npm run prepare --workspace apps/virtual-lab

      - name: Typecheck the app
        run: npm run typecheck --workspace apps/virtual-lab

      - name: Build the app
        run: npm run build --workspace apps/virtual-lab
