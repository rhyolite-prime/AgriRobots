name: CI

on:
  push:
    branches:
      - master
      - dev
      - "arena/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Structure, links, types, lint, format, tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check repository boundaries
        run: npm run check:tree

      - name: Check documentation links
        run: npm run check:links

      - name: Check DSL grammar conformance
        run: npm run check:grammar

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Unit tests
        run: npm run test

  virtual-lab:
    # The app is not covered by `npm run verify`: the root typecheck does not see
    # Vue single-file components, and only a real build proves that Nitro can
    # bundle the workspace packages' TypeScript sources.
    name: Virtual Lab typecheck and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare Nuxt types
        run: npm run prepare --workspace apps/virtual-lab

      - name: Typecheck the app
        run: npm run typecheck --workspace apps/virtual-lab

      - name: Build the app
        run: npm run build --workspace apps/virtual-lab

  engine-cpp:
    # `npm run verify` cannot compile C++. This job is the gate that proves the
    # engine a robot runs and the engine the Virtual Lab runs produce the same
    # bytes: it rebuilds engine/ from vendored dependencies and re-derives every
    # golden trace hash in engine/testdata/.
    name: C++ engine build and equivalence tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          cmake --version | head -1
          c++ --version | head -1

      - name: Configure
        run: cmake -S engine -B engine/build -DCMAKE_BUILD_TYPE=Release -DAGRI_ENGINE_WERROR=ON

      - name: Build
        run: cmake --build engine/build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir engine/build --output-on-failure
